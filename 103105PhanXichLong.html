<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:column; width:100%; height:100vh; box-sizing:border-box; justify-content:space-between; }.carousel-container { width:100%; flex:1; position:relative; overflow:hidden; background:#151515; display:flex; align-items:center; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { width:100%; height:100%; object-fit:contain; }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#ffffff; border:none; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.2s ease; backdrop-filter:blur(4px); box-shadow:0 2px 8px rgba(0,0,0,0.2); }.nav-btn:hover { background:rgba(0,0,0,0.8); scale:1.08; }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.6); color:#fff; padding:5px 12px; font-size:13px; font-weight:500; border-radius:20px; z-index:10; backdrop-filter:blur(4px); }.thumbs-container { width:100%; height:75px; background:#fafafa; box-sizing:border-box; padding:10px 15px; display:flex; gap:8px; overflow-x:auto; border-top:1px solid #eeeeee; -webkit-overflow-scrolling:touch; }.thumbs-container::-webkit-scrollbar { height:4px; }.thumbs-container::-webkit-scrollbar-thumb { background:#cccccc; border-radius:4px; }.thumb-item { width:75px; height:55px; flex-shrink:0; border-radius:4px; overflow:hidden; cursor:pointer; opacity:0.45; border:2px solid transparent; transition:all 0.2s; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#007aff; transform:scale(1.02); box-shadow:0 2px 8px rgba(0,122,255,0.3); }</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822781/1_ji0pkj.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/4_ocrill.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/5_yza3ds.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/10_a0d7nu.png" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822696/7_nh6ygf.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/9_r2925b.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/a_fd3wdg.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/b_vdvcaz.jpg" alt="BDS 8" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822773/3_yefzlu.jpg" alt="BDS 9" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781273454/103_105_Phan_Xi%CC%81ch_Long_phu%CC%9Bo%CC%9B%CC%80ng_Ca%CC%82%CC%80u_Kie%CC%A3%CC%82u_TP_etgqpg.mp4" alt="BDS 10" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 10</div></div><div class="thumbs-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822781/1_ji0pkj.jpg"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/4_ocrill.jpg"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/5_yza3ds.jpg"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/10_a0d7nu.png"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822696/7_nh6ygf.jpg"></div><div class="thumb-item" onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/9_r2925b.jpg"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/a_fd3wdg.jpg"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/b_vdvcaz.jpg"></div><div class="thumb-item" onclick="goToSlide(8)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822773/3_yefzlu.jpg"></div><div class="thumb-item" onclick="goToSlide(9)"><img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781273454/103_105_Phan_Xi%CC%81ch_Long_phu%CC%9Bo%CC%9B%CC%80ng_Ca%CC%82%CC%80u_Kie%CC%A3%CC%82u_TP_etgqpg.mp4"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 10;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) {      updateActiveStatus(index);    }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
