<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#ffffff; }.carousel-container { width:100%; height:100vh; position:relative; display:flex; align-items:center; justify-content:center; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { width:100%; height:100%; object-fit:cover; border-radius:4px; pointer-events:none; }.indicator { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 10px; font-size:12px; font-weight:bold; border-radius:12px; font-family:sans-serif; pointer-events:none; }</style></head><body><div class="carousel-container"><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822781/1_ji0pkj.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/4_ocrill.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822772/5_yza3ds.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/10_a0d7nu.png" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822696/7_nh6ygf.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/9_r2925b.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/a_fd3wdg.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822694/b_vdvcaz.jpg" alt="BDS 8" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780822773/3_yefzlu.jpg" alt="BDS 9" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781273454/103_105_Phan_Xi%CC%81ch_Long_phu%CC%9Bo%CC%9B%CC%80ng_Ca%CC%82%CC%80u_Kie%CC%A3%CC%82u_TP_etgqpg.mp4" alt="BDS 10" loading="lazy"></div></div><div class="indicator" id="counter">1 / 10</div></div><script>const slider = document.getElementById("slider");slider.addEventListener("scroll", () => {  const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;  document.getElementById("counter").innerText = pageIndex + " / " + 10;});</script></body></html>
