<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    /* Tăng chiều cao khung chứa tối đa lên 600px để slide hiển thị to rõ hơn */
    .carousel-container { width: 100%; height: 100vh; max-height: 600px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    /* Thiết lập ảnh tự động co giãn thông minh tràn khung ảnh lớn */
    .carousel-slide img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; pointer-events: none; }
    .indicator { position: absolute; bottom: 16px; right: 16px; background: rgba(15, 15, 15, 0.75); color: #ffffff; padding: 5px 12px; font-size: 13px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732677/z6880661355802_a2757479fb4dbc455c652c155d633d4a_y0fegr.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732671/z6880661642717_213b39337368a75ecf046f5f0638e787_phkugc.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732670/z6880661470791_932d84fcc4f382612e05280522819478_tqevmq.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732670/z6880661528841_bab5d71bd5797a5d846d1524bb03e23c_uxfxwu.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732670/z6880661414065_1ceb4bed8cb8122c6ac7b4d61067e8f8_hkls6l.jpg" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732668/4._sstth4.jpg" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732624/SH_1_clxprz.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732623/QH_1_fg7fuw.png" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732635/MB_c%E1%BA%AFt_d%E1%BB%8Dc_cach0c.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732635/MB__l%E1%BA%A7u_1_fvpzs4.jpg" alt="BDS Image 10" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780732634/Tuy%E1%BA%BFn_%C4%91%C6%B0%E1%BB%9Dng_metro_5_hygdr7.jpg" alt="BDS Image 11" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 11</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 11;
    });
  </script>
</body>
</html>
