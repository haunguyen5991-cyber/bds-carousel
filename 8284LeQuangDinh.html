<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/98c2e7ef12e0-z6490823489946_1d0ca6f0b6510e6afa4039e5c6b6f5a5_yep51y.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/63f3e14eb094--E1-BA-A2nh_nh-C3-A0_new_cxbh0m.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/7eb99822d606-4_glj09u.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/a7830b9ed86e-9_oy9mlz.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/2ca4c98c60a5-6_z79ttm.jpg" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/3270b41d920c-8_fh2yaf.jpg" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/b2e513ca40b2-3_or9q0f.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/aef80c1df074-SH_u1ynit.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/87e35812203d-SH_1_hnbiex.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 9</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 9;
    });
  </script>
</body>
</html>
