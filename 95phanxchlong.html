    } else {      img.style.transformOrigin = "center center";    }  }  document.getElementById("prevBtn").onclick = () => { current = (current - 1 + items.length) % items.length; zoomed = false; render(); };  document.getElementById("nextBtn").onclick = () => { current = (current + 1) % items.length; zoomed = false; render(); };  document.addEventListener("keydown", (e) => {    if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();    if (e.key === "ArrowRight") document.getElementById("nextBtn").click();  });  renderThumbs();  render();</script></body></html>
