<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body,html{margin:0;padding:0;width:100%;height:100%;background:#0f0f0f;font-family:-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;overflow:hidden}.main-layout{display:flex;flex-direction:row;width:100%;height:100vh;box-sizing:border-box;overflow:hidden}.carousel-container{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100%;background:transparent}.carousel-inner{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scroll-behavior:smooth}.carousel-inner::-webkit-scrollbar{display:none}.carousel-slide{min-width:100%;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0a0a0a}.img-zoom-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.img-zoom-container img{width:100%;height:100%;object-fit:contain;transition:transform .2s ease-out;cursor:zoom-in}.img-zoom-container img.zoomed{transform:scale(2.2);cursor:zoom-out;object-fit:contain}.thumbnail-sidebar{width:110px;background:rgba(10,10,10,.85);backdrop-filter:blur(15px);display:flex;flex-direction:column;gap:10px;padding:10px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.05);box-sizing:border-box;height:100%}.thumbnail-sidebar::-webkit-scrollbar{width:3px}.thumbnail-sidebar::-webkit-scrollbar-thumb{background:#D4AF37;border-radius:4px}.thumb-item{width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;cursor:pointer;opacity:.35;border:2px solid transparent;transition:all .2s ease;flex-shrink:0;position:relative}.thumb-item img{width:100%;height:100%;object-fit:cover}.thumb-item:hover{opacity:.7;transform:scale(1.03)}.thumb-item.active{opacity:1;border-color:#D4AF37;box-shadow:0 0 12px rgba(212,175,55,.4)}.video-badge{position:absolute;top:2px;left:2px;background:#D4AF37;color:#000;font-size:8px;font-weight:bold;padding:1px 4px;border-radius:3px;z-index:5}.play-icon-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#D4AF37;font-size:18px;z-index:4;pointer-events:none}.video-placeholder-bg{width:100%;height:100%;background:#222}</style></head><body><div class="main-layout"><div class="carousel-container"><div class="carousel-inner" id="carouselInner">
<div class="carousel-slide"><div class="img-zoom-container"><img src="P2" alt="BDS 1" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div></div></div><div class="thumbnail-sidebar">
<div class="thumb-item active" onclick="goToSlide(0)"><img src="P2" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=No+Image'"></div></div></div><script>var inner=document.getElementById("carouselInner"),items=document.querySelectorAll(".thumb-item");function goToSlide(e){resetAllZoom();var t=inner.clientWidth;inner.scrollTo({left:t*e,behavior:"smooth"}),updateActiveThumb(e)}function updateActiveThumb(e){items.forEach(function(t,n){n===e?t.classList.add("active"):t.classList.remove("active")})}function toggleZoom(e){e.classList.contains("zoomed")?(e.classList.remove("zoomed"),e.style.transformOrigin="center center"):(resetAllZoom(),e.classList.add("zoomed"))}function zoomMove(e,t){if(!t.classList.contains("zoomed"))return;var n=t.getBoundingClientRect(),r=(e.clientX-n.left)/n.width*100,i=(e.clientY-n.top)/n.height*100;t.style.transformOrigin=r+"% "+i+"%"}function resetAllZoom(){document.querySelectorAll(".img-zoom-container img").forEach(function(e){e.classList.remove("zoomed"),e.style.transformOrigin="center center"})}inner.addEventListener("scroll",function(){clearTimeout(window.scrollTM),window.scrollTM=setTimeout(function(){var e=Math.round(inner.scrollLeft/inner.clientWidth);updateActiveThumb(e)},120)});</script></body></html>
