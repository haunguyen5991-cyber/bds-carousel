<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001967/%E1%BA%A3nh_l%C3%B4_%C4%91%E1%BA%A5t_l0tr6m.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001951/z6794927775635_297a723932e650915757b8fe0ab0bf9a_mxnwjs.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001952/z6794927740261_6c20345dbe95027825e9851f3e99292a_uyhrey.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001950/z6794927722532_ee1b075037a3663dc4702479eb7ad09d_xcm9ja.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781001965/6794927815173_v5qkxb.mp4" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781001951/6794927716153_njrxkd.mp4" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001965/z6794927852996_3b3592bd06c1ef84638ba2351da3d1ff_swzwpt.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781001981/SH_2_iejlc7.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781002020/SH_1_et0fzx.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 9</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 9;
    });
  </script>
</body>
</html>
