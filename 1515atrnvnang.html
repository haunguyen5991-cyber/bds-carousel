<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-15A Trần Văn Đang, P11, Quận 3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.main-layout{display:flex;flex-direction:row;width:100%;height:100vh}.carousel-container{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;height:100%;background:#111}.carousel-inner{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scroll-behavior:smooth}.carousel-inner::-webkit-scrollbar{display:none}.carousel-slide{min-width:100%;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}.carousel-slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;cursor:zoom-in}.nav-btn,.fullscreen-prev,.fullscreen-next,.fullscreen-close{position:absolute;border:0;cursor:pointer;z-index:10}.nav-btn{top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}.nav-left{left:18px}.nav-right{right:18px}.indicator{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:5px;font-size:12px;z-index:10}.thumbs-vertical-container{width:105px;height:100%;background:#141414;padding:18px 10px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;border-left:1px solid #333}.thumb-item{width:82px;height:62px;flex-shrink:0;border-radius:4px;overflow:hidden;cursor:pointer;opacity:.4;border:1px solid transparent;margin:0 auto}.thumb-item img{width:100%;height:100%;object-fit:cover}.thumb-item.active{opacity:1;border-color:#fff}.fullscreen-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.95);padding:24px}.fullscreen-overlay.open{display:flex}.fullscreen-overlay img{max-width:calc(100vw - 96px);max-height:calc(100vh - 72px);object-fit:contain}.fullscreen-close,.fullscreen-prev,.fullscreen-next{background:rgba(30,30,30,.8);color:#fff;width:44px;height:44px;border-radius:50%;font-size:30px}.fullscreen-close{top:18px;right:18px}.fullscreen-prev{left:18px;top:50%;transform:translateY(-50%)}.fullscreen-next{right:18px;top:50%}@media(max-width:600px){.main-layout{flex-direction:column}.thumbs-vertical-container{width:100%;height:75px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-left:0;border-top:1px solid #333;padding:7px}.thumb-item{width:70px;height:58px}}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">‹</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/82e4d846c80d--E1-BA-A2nh_nh-C3-A0_ze8ov6.jpg" alt="Ảnh 15-15A Trần Văn Đang, P11, Quận 3" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/f9ad201a6ce8-SH_15A_vf6w6j.jpg" alt="Ảnh 15-15A Trần Văn Đang, P11, Quận 3" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/d76acef83307-QH_hcqgl6.jpg" alt="Ảnh 15-15A Trần Văn Đang, P11, Quận 3" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">›</button><div class="indicator" id="counter">1 / 3</div></div><div class="thumbs-vertical-container"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/82e4d846c80d--E1-BA-A2nh_nh-C3-A0_ze8ov6.jpg" loading="lazy"></div><div class="thumb-item " onclick="goToSlide(1)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/f9ad201a6ce8-SH_15A_vf6w6j.jpg" loading="lazy"></div><div class="thumb-item " onclick="goToSlide(2)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/d76acef83307-QH_hcqgl6.jpg" loading="lazy"></div></div></div><div class="fullscreen-overlay" id="overlay"><button class="fullscreen-close" id="close">×</button><button class="fullscreen-prev" id="fprev">‹</button><img id="full"><button class="fullscreen-next" id="fnext">›</button></div><script>const urls=["https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/82e4d846c80d--E1-BA-A2nh_nh-C3-A0_ze8ov6.jpg", "https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/f9ad201a6ce8-SH_15A_vf6w6j.jpg", "https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/d76acef83307-QH_hcqgl6.jpg"],slider=document.getElementById('slider'),thumbs=[...document.querySelectorAll('.thumb-item')],counter=document.getElementById('counter'),overlay=document.getElementById('overlay'),full=document.getElementById('full');let current=0;function update(i){current=(i+urls.length)%urls.length;slider.scrollTo({left:current*slider.clientWidth,behavior:'smooth'});counter.textContent=(current+1)+' / '+urls.length;thumbs.forEach((t,n)=>t.classList.toggle('active',n===current));}function goToSlide(i){update(i)}function moveSlide(d){update(current+d)}document.querySelectorAll('.carousel-slide img').forEach((img,i)=>img.onclick=()=>{current=i;full.src=urls[i];overlay.classList.add('open')});close.onclick=()=>overlay.classList.remove('open');fprev.onclick=()=>{current=(current-1+urls.length)%urls.length;full.src=urls[current]};fnext.onclick=()=>{current=(current+1)%urls.length;full.src=urls[current]};overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')overlay.classList.remove('open');if(e.key==='ArrowLeft'){current=(current-1+urls.length)%urls.length;full.src=urls[current]}if(e.key==='ArrowRight'){current=(current+1)%urls.length;full.src=urls[current]}};</script></body></html>
