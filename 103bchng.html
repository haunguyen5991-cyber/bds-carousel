<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>103bchng</title><style>  * { margin:0; padding:0; box-sizing:border-box; }  html,body { height:100%; background:#0b0b0c; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }  .gallery { display:flex; width:100vw; height:100vh; background:#0b0b0c; }  .main-view { flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#000; cursor:zoom-in; }  .main-view.zoomed { cursor:grab; }  .main-view.zoomed:active { cursor:grabbing; }  .main-media { max-width:100%; max-height:100%; object-fit:contain; transition:transform .25s ease; user-select:none; -webkit-user-drag:none; }  .main-media.zoomed { transform:scale(2.2); transition:none; }  .thumb-rail { width:110px; background:#111113; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; padding:12px 8px; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:flex-start; }  .thumb-rail::-webkit-scrollbar { display:none; }  .thumb { width:88px; height:88px; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.55; transition:all .2s ease; position:relative; background:#000; flex-shrink:0; }  .thumb:hover { opacity:.9; }  .thumb.active { opacity:1; border-color:#d4af37; }  .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; pointer-events:none; }  .thumb .play-icon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; text-shadow:0 1px 4px rgba(0,0,0,.7); }  .counter { position:absolute; top:16px; left:16px; color:#fff; background:rgba(0,0,0,.45); padding:5px 12px; border-radius:20px; font-size:13px; letter-spacing:.5px; backdrop-filter:blur(4px); }  .nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.35); color: dx === current ? " active" : "");      if (item.type === "video") {        t.innerHTML = '<video src="' + item.url + '" muted preload="metadata"></video><div class="play-icon">▶</div>';      } else {        t.innerHTML = '<img src="' + item.url + '" loading="lazy">';      }      t.onclick = () => { current = idx; zoomed = false; render(); };      thumbRail.appendChild(t);    });  }  function render() {    const item = items[current];    mainWrap.innerHTML = "";    let el;    if (item.type === "video") {      el = document.createElement("video");      el.src = item.url; el.controls = true; el.autoplay = false; el.className = "main-media";    } else {      el = document.createElement("img");      el.src = item.url; el.className = "main-media"; el.draggable = false;      el.onclick = (e) => { toggleZoom(e); };    }    mainWrap.appendChild(el);    counter.textContent = (current + 1) + " / " + items.length;    Array.from(thumbRail.children).forEach((t, i) => t.classList.toggle("active", i === current));    thumbRail.children[current] && thumbRail.children[current].scrollIntoView({ block: "nearest", behavior: "smooth" });  }  function toggleZoom(e) {    const img = mainWrap.querySelector(".main-media");    if (!img || img.tagName !== "IMG") return;    zoomed = !zoomed;    img.classList.toggle("zoomed", zoomed);    mainView.classList.toggle("zoomed", zoomed);    if (zoomed) {      const rect = img.getBoundingClientRect();      const x = ((e.clientX - rect.left) / rect.width) * 100;      const y = ((e.clientY - rect.top) / rect.height) * 100;      img.style.transformOrigin = x + "% " + y + "%";    } else {      img.style.transformOrigin = "center center";    }  }  document.getElementById("prevBtn").onclick = () => { current = (current - 1 + items.length) % items.length; zoomed = false; render(); };  document.getElementById("nextBtn").onclick = () => { current = (current + 1) % items.length; zoomed = false; render(); };  document.addEventListener("keydown", (e) => {    if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();    if (e.key === "ArrowRight") document.getElementById("nextBtn").click();  });  renderThumbs();  render();</script></body></html>
