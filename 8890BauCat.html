<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/83f34f10fcd9-z7918172385997_0888a7e2ab4cbf87d90412da79e510cb_sy1ytp.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/dcdc2eb7b64f-z7918172278916_0596c54b56c296edd5dc43470766669c_slmupd.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/e7018f7a1c11-z7918172870542_2f8018ab31a6fd30c9af21250bc8b614_uamgje.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/5cefe7f5c4ab-z7918172493815_ec584af569b7c2df206b4aab848b023d_rb1msc.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fd95e7b360ae-z7918172761859_da2853e8f9c6a765ab7113f1bba2d90e_w3hjts.jpg" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/a6393d2b6fb7-z7918171684357_42888345e7fe6345e2055f046d6cf2d6_uozzlg.jpg" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/8b2142a8617a-z7918172118862_c94d9e091935789ef036315c82b99313_nkgcdu.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/9a075d7694d4-SH_90_1_a4yapx.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/b88860efdf45-SH_88_tfoqxa.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c713ea3878a0-SH_90_2_sc0z9z.jpg" alt="BDS Image 10" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 10</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 10;
    });
  </script>
</body>
</html>
