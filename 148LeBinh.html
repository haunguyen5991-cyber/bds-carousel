<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background-color:#111111; font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; background:#111111; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; height:100%; background:#1a1a1a; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; background:#111111; }.carousel-slide img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.4); color:#ffffff; border:none; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.2s ease; backdrop-filter:blur(4px); }.nav-btn:hover { background:rgba(0,0,0,0.7); transform:translateY(-50%) scale(1.05); }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; left:15px; background:rgba(0,0,0,0.6); color:#fff; padding:5px 12px; font-size:12px; font-weight:500; border-radius:20px; z-index:10; backdrop-filter:blur(4px); }.thumbs-vertical-container { width:95px; height:100%; background:#161616; box-sizing:border-box; padding:15px 8px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-left:1px solid #222222; -webkit-overflow-scrolling:touch; }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#333333; border-radius:4px; }.thumb-item { width:76px; height:58px; flex-shrink:0; border-radius:6px; overflow:hidden; cursor:pointer; opacity:0.35; border:2px solid transparent; transition:all 0.2s ease; margin:0 auto; box-sizing:border-box; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#007aff; transform:scale(1.02); box-shadow:0 0 8px rgba(0,122,255,0.4); }/* Đáp ứng tương thích linh hoạt cho các thiết bị di động nhỏ */@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:70px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid #222222; padding:8px; gap:8px; }  .thumb-item { width:65px; height:48px; }}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723530/IMG_3514_clzhif.heic" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723532/IMG_3512_yyuwye.heic" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723539/IMG_3508_mmivvw.heic" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723535/IMG_3510_zbj5nc.heic" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723542/IMG_4078_2_f6mpe0.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723541/IMG_4077_2_h5xg4y.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723545/IMG_4075_2_tmaakk.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723558/IMG_4066_2_p9oglb.jpg" alt="BDS 8" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723562/IMG_4064_2_jhipeq.jpg" alt="BDS 9" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723565/IMG_4061_2_dbbxvk.jpg" alt="BDS 10" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723568/IMG_4060_2_zbluh4.jpg" alt="BDS 11" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723582/IMG_4039_2_ok3fpn.jpg" alt="BDS 12" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723726/IMG_4036_2_dhjath.jpg" alt="BDS 13" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780724797/SH_smzkxn.jpg" alt="BDS 14" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 14</div></div><div class="thumbs-vertical-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723530/IMG_3514_clzhif.heic"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723532/IMG_3512_yyuwye.heic"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723539/IMG_3508_mmivvw.heic"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723535/IMG_3510_zbj5nc.heic"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723542/IMG_4078_2_f6mpe0.jpg"></div><div class="thumb-item" onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723541/IMG_4077_2_h5xg4y.jpg"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723545/IMG_4075_2_tmaakk.jpg"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723558/IMG_4066_2_p9oglb.jpg"></div><div class="thumb-item" onclick="goToSlide(8)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723562/IMG_4064_2_jhipeq.jpg"></div><div class="thumb-item" onclick="goToSlide(9)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723565/IMG_4061_2_dbbxvk.jpg"></div><div class="thumb-item" onclick="goToSlide(10)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723568/IMG_4060_2_zbluh4.jpg"></div><div class="thumb-item" onclick="goToSlide(11)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723582/IMG_4039_2_ok3fpn.jpg"></div><div class="thumb-item" onclick="goToSlide(12)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723726/IMG_4036_2_dhjath.jpg"></div><div class="thumb-item" onclick="goToSlide(13)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780724797/SH_smzkxn.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 14;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) {      updateActiveStatus(index);    }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
