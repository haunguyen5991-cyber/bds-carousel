<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723530/IMG_3514_clzhif.heic" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723532/IMG_3512_yyuwye.heic" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723539/IMG_3508_mmivvw.heic" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723535/IMG_3510_zbj5nc.heic" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723542/IMG_4078_2_f6mpe0.jpg" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723541/IMG_4077_2_h5xg4y.jpg" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723545/IMG_4075_2_tmaakk.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723558/IMG_4066_2_p9oglb.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723562/IMG_4064_2_jhipeq.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723565/IMG_4061_2_dbbxvk.jpg" alt="BDS Image 10" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723568/IMG_4060_2_zbluh4.jpg" alt="BDS Image 11" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723582/IMG_4039_2_ok3fpn.jpg" alt="BDS Image 12" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780723726/IMG_4036_2_dhjath.jpg" alt="BDS Image 13" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780724797/SH_smzkxn.jpg" alt="BDS Image 14" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 14</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 14;
    });
  </script>
</body>
</html>
