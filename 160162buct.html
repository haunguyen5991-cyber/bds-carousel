<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body,html{margin:0;padding:0;width:100%;height:100%;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;user-select:none}.layout{display:flex;width:100%;height:100vh;position:relative}.viewer-zone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}.carousel-inner{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}.carousel-inner::-webkit-scrollbar{display:none}.carousel-slide{min-width:100%;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#050505;overflow:hidden}.carousel-slide video{width:100%;height:100%;object-fit:contain;background:#000}.img-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.img-container img{width:100%;height:100%;object-fit:contain;transition:transform .2s ease-out;cursor:zoom-in}.img-container img.zoomed{transform:scale(2.2);cursor:zoom-out}.sidebar{width:115px;background:rgba(15,15,15,.95);display:flex;flex-direction:column;gap:12px;padding:12px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06);box-sizing:border-box}.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#D4AF37;border-radius:10px}.thumb-item{width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;cursor:pointer;opacity:.4;border:2px solid transparent;transition:all .25s ease;position:relative;flex-shrink:0}.thumb-item img{width:100%;height:100%;object-fit:cover}.thumb-item:hover{opacity:.8;transform:translateY(-2px)}.thumb-item.active{opacity:1;border-color:#D4AF37;box-shadow:0 0 15px rgba(212,175,55,.5)}.video-bg-placeholder{width:100%;height:100%;background:#1a1a1a}.video-badge{position:absolute;top:4px;left:4px;background:#D4AF37;color:#000;font-size:8px;
