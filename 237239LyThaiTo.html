<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 100%); font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100%; background: transparent; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { max-width:96%; max-height:96%; width:auto; height:auto; object-fit:contain; filter: drop-shadow(0px 8px 24px rgba(0,0,0,0.7)); border-radius:6px; }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.6); color:#ffffff; border:1px solid rgba(255,255,255,0.1); width:44px; height:44px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.25s ease; backdrop-filter:blur(8px); }.nav-btn:hover { background:rgba(212,175,55,0.25); color:#d4af37; border-color:#d4af37; transform:translateY(-50%) scale(1.05); }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; left:15px; background:rgba(15,15,15,0.8); color:#d4af37; border:1px solid rgba(212,175,55,0.3); padding:5px 12px; font-size:11px; font-weight:600; border-radius:4px; letter-spacing:0.5px; z-index:10; backdrop-filter:blur(6px); }.thumbs-vertical-container { width:110px; height:100%; background: #0f0f0f; box-sizing:border-box; padding:15px 10px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-left:1px solid rgba(212,175,55,0.15); }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#d4af37; border-radius:2px; }.thumb-item { width:86px; height:65px; flex-shrink:0; border-radius:4px; overflow:hidden; cursor:pointer; opacity:0.35; border:1.5px solid transparent; transition:all 0.2s ease; margin:0 auto; box-sizing:border-box; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#d4af37; box-shadow:0 0 10px rgba(212,175,55,0.35); }@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:75px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid rgba(212,175,55,0.15); padding:8px; gap:8px; }  .thumb-item { width:75px; height:56px; }}
.fullscreen-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);backdrop-filter:blur(6px);padding:24px;box-sizing:border-box}.fullscreen-overlay.open{display:flex}.fullscreen-overlay img{max-width:calc(100vw - 96px);max-height:calc(100vh - 72px);width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.65)}.fullscreen-close,.fullscreen-prev,.fullscreen-next{position:absolute;border:0;color:#fff;background:rgba(30,30,30,.72);cursor:pointer;width:44px;height:44px;border-radius:50%;font-size:30px;line-height:40px;text-align:center;z-index:2}.fullscreen-close{top:18px;right:18px;font-size:28px}.fullscreen-prev{left:18px;top:50%;transform:translateY(-50%)}.fullscreen-next{right:18px;top:50%;transform:translateY(-50%)}.fullscreen-close:hover,.fullscreen-prev:hover,.fullscreen-next:hover{background:rgba(212,175,55,.9);color:#111}.carousel-slide img{cursor:zoom-in}@media(max-width:600px){.fullscreen-overlay{padding:12px}.fullscreen-overlay img{max-width:calc(100vw - 56px);max-height:calc(100vh - 56px)}.fullscreen-close{top:10px;right:10px}.fullscreen-prev{left:6px}.fullscreen-next{right:6px}}
</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/65b7a5a5d1e8-2_asaprm.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c41b0f79e89a-1_b3ildv.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/708c4d41f1b5-4_vrigem.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fbc7fd6874f7-z7876164628334_51e7c3dddfbd4d15d4da960e868f44d1_sy3zs5.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/a092e18b4457-z7876164603567_ba6e1ebe60c36750b50deb99f75b6eea_e7luhl.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fe47835e7637-CV_1_l-C3-BD_th-C3-A1i_t-E1-BB-95_a9mwgb.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/3a8d5aa10792-BV_N-C4-90_z3pbxh.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/97f433eba7a6-z7856946428358_106394d032b3eec12d66c49a177377ff_d8p3j9.jpg" alt="BDS 8" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/d35c483e5e1f-z7885903867604_77fed5cf4f52cfdfeed241558b802318_ieyfms.jpg" alt="BDS 9" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/ca357104b886-a_gzksqo.jpg" alt="BDS 10" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/5f0ec6c3b95c-z7885903848389_539151f5f90e0e3eb1263ba8c6ab2002_gpxgni.jpg" alt="BDS 11" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c01ab096db22-z7885903861174_151a20e6654d297b707dbda99f2a46d4_ml0pzp.jpg" alt="BDS 12" loading="lazy"></div><div class="carousel-slide"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/80b8e910b23b-z7885903849275_bc4bf2542811a27203f8370e535ad456_eahgkc.jpg" alt="BDS 13" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 13</div></div><div class="thumbs-vertical-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/65b7a5a5d1e8-2_asaprm.jpg"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c41b0f79e89a-1_b3ildv.jpg"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/708c4d41f1b5-4_vrigem.jpg"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fbc7fd6874f7-z7876164628334_51e7c3dddfbd4d15d4da960e868f44d1_sy3zs5.jpg"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/a092e18b4457-z7876164603567_ba6e1ebe60c36750b50deb99f75b6eea_e7luhl.jpg"></div><div class="thumb-item" onclick="goToSlide(5)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fe47835e7637-CV_1_l-C3-BD_th-C3-A1i_t-E1-BB-95_a9mwgb.jpg"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/3a8d5aa10792-BV_N-C4-90_z3pbxh.jpg"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/97f433eba7a6-z7856946428358_106394d032b3eec12d66c49a177377ff_d8p3j9.jpg"></div><div class="thumb-item" onclick="goToSlide(8)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/d35c483e5e1f-z7885903867604_77fed5cf4f52cfdfeed241558b802318_ieyfms.jpg"></div><div class="thumb-item" onclick="goToSlide(9)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/ca357104b886-a_gzksqo.jpg"></div><div class="thumb-item" onclick="goToSlide(10)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/5f0ec6c3b95c-z7885903848389_539151f5f90e0e3eb1263ba8c6ab2002_gpxgni.jpg"></div><div class="thumb-item" onclick="goToSlide(11)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c01ab096db22-z7885903861174_151a20e6654d297b707dbda99f2a46d4_ml0pzp.jpg"></div><div class="thumb-item" onclick="goToSlide(12)"><img src="https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/80b8e910b23b-z7885903849275_bc4bf2542811a27203f8370e535ad456_eahgkc.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 13;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) { updateActiveStatus(index); }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script><div class="fullscreen-overlay" id="fullscreenOverlay" role="dialog" aria-modal="true" aria-label="Xem ảnh toàn màn hình"><button class="fullscreen-close" id="fullscreenClose" aria-label="Đóng">×</button><button class="fullscreen-prev" id="fullscreenPrev" aria-label="Ảnh trước">‹</button><img id="fullscreenImage" alt="Ảnh bất động sản toàn màn hình"><button class="fullscreen-next" id="fullscreenNext" aria-label="Ảnh tiếp theo">›</button></div><script>
(function(){var overlay=document.getElementById("fullscreenOverlay"),fullImg=document.getElementById("fullscreenImage"),closeBtn=document.getElementById("fullscreenClose"),prevBtn=document.getElementById("fullscreenPrev"),nextBtn=document.getElementById("fullscreenNext"),slides=Array.prototype.slice.call(document.querySelectorAll(".carousel-slide img")),current=0;function show(i){if(!slides.length)return;current=(i+slides.length)%slides.length;fullImg.src=slides[current].src;fullImg.alt=slides[current].alt||"Ảnh bất động sản";overlay.classList.add("open");document.body.style.overflow="hidden";}function close(){overlay.classList.remove("open");document.body.style.overflow="hidden";fullImg.removeAttribute("src");}slides.forEach(function(img,i){img.addEventListener("click",function(e){e.stopPropagation();show(i);});});closeBtn.addEventListener("click",function(e){e.stopPropagation();close();});prevBtn.addEventListener("click",function(e){e.stopPropagation();show(current-1);});nextBtn.addEventListener("click",function(e){e.stopPropagation();show(current+1);});overlay.addEventListener("click",function(e){if(e.target===overlay)close();});document.addEventListener("keydown",function(e){if(!overlay.classList.contains("open"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(current-1);else if(e.key==="ArrowRight")show(current+1);});})();
</script></body></html>
