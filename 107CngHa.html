<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body,html{margin:0;padding:0;width:100%;height:100%;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
    .layout{display:flex;width:100%;height:100vh;position:relative}
    .viewer-zone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
    .carousel-inner{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}
    .carousel-inner::-webkit-scrollbar{display:none}
    .carousel-slide{min-width:100%;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#050505;overflow:hidden}
    .carousel-slide video{width:100%;height:100%;object-fit:contain;background:#000}
    .img-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .img-container img{width:100%;height:100%;object-fit:contain;transition:transform 0.2s ease-out;cursor:zoom-in}
    .img-container img.zoomed{transform:scale(2.2);cursor:zoom-out}
    
    /* Giao diện thanh Sidebar Thumbnail cao cấp */
    .sidebar{width:115px;background:rgba(15,15,15,0.95);display:flex;flex-direction:column;gap:12px;padding:12px;overflow-y:auto;border-left:1px solid rgba(255,255,255,0.06);box-sizing:border-box}
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-thumb{background:#D4AF37;border-radius:10px}
    .thumb-item{width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;cursor:pointer;opacity:0.4;border:2px solid transparent;transition:all 0.25s ease;position:relative;flex-shrink:0}
    .thumb-item img{width:100%;height:100%;object-fit:cover}
    .thumb-item:hover{opacity:0.8;transform:translateY(-2px)}
    .thumb-item.active{opacity:1;border-color:#D4AF37;box-shadow:0 0 15px rgba(212,175,55,0.5)}
    
    /* Linh hồn phân biệt Video chuyên nghiệp */
    .video-bg-placeholder{width:100%;height:100%;background:#1a1a1a}
    .video-badge{position:absolute;top:4px;left:4px;background:#D4AF37;color:#000;font-size:8px;font-weight:bold;padding:2px 5px;border-radius:3px;z-index:10}
    .play-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);z-index:5}
    .play-overlay svg{width:22px;height:22px;fill:#D4AF37;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5))}
    
    /* Nút mũi tên chuyển slide & Bộ đếm số trang chuyên nghiệp */
    .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:45px;height:45px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:18px;z-index:20;transition:all 0.2s}
    .nav-btn:hover{background:#D4AF37;color:#000;border-color:#D4AF37;box-shadow:0 0 10px rgba(212,175,55,0.4)}
    .btn-prev{left:20px}.btn-next{right:20px}
    .counter-badge{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.7);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:1px;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
  </style>
</head>
<body>
  <div class="layout">
    <div class="viewer-zone">
      <div class="counter-badge" id="slideCounter">1 / 8</div>
      <div class="nav-btn btn-prev" onclick="moveSlide(-1)">❮</div>
      <div class="nav-btn btn-next" onclick="moveSlide(1)">❯</div>
      <div class="carousel-inner" id="carouselInner">
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118666965363_a7afed8649c739e12d5b25e05deaf2e4_nyf3nd.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815223/z6118667518088_2090e3918929b2841d7425608e57946d_lgfwfy.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815215/z6781059545143_a926f03862a8fce8f595f7846afb1709_uf22ti.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118667551862_4bd8c2333a38b50a63085c5618bf163d_lpldx8.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815176/z6781059560106_7b03aaf82fd53472090e386264931407_brrp4b.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815222/z6781059550624_28cd8a77ef28ff1eafb5ab076bb6f8e1_thjqzg.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815245/z6118667526847_a758b50c6404f1fc5c5ed4d09ed685fa_vzvlgf.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div>
<div class="carousel-slide"><div class="img-container"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815246/z6118667567900_4b4dea0710b79b894f464179e198e196_tz3z1x.jpg" alt="BDS" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)"></div></div></div>
    </div>
    <div class="sidebar">
<div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118666965363_a7afed8649c739e12d5b25e05deaf2e4_nyf3nd.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815223/z6118667518088_2090e3918929b2841d7425608e57946d_lgfwfy.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815215/z6781059545143_a926f03862a8fce8f595f7846afb1709_uf22ti.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118667551862_4bd8c2333a38b50a63085c5618bf163d_lpldx8.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815176/z6781059560106_7b03aaf82fd53472090e386264931407_brrp4b.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815222/z6781059550624_28cd8a77ef28ff1eafb5ab076bb6f8e1_thjqzg.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815245/z6118667526847_a758b50c6404f1fc5c5ed4d09ed685fa_vzvlgf.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div>
<div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815246/z6118667567900_4b4dea0710b79b894f464179e198e196_tz3z1x.jpg" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=Lỗi+Ảnh'"></div></div>
  </div>

  <script>
    var inner = document.getElementById("carouselInner");
    var thumbs = document.querySelectorAll(".thumb-item");
    var counter = document.getElementById("slideCounter");
    var currentIndex = 0;
    var totalSlides = 8;

    function goToSlide(index) {
      if(index < 0 || index >= totalSlides) return;
      currentIndex = index;
      resetZoom();
      var width = inner.clientWidth;
      inner.scrollTo({ left: width * currentIndex, behavior: "smooth" });
      updateUI();
    }

    function moveSlide(direction) {
      var target = currentIndex + direction;
      if(target >= 0 && target < totalSlides) goToSlide(target);
    }

    function updateUI() {
      thumbs.forEach((t, i) => {
        if(i === currentIndex) t.classList.add("active");
        else t.classList.remove("active");
      });
      counter.innerText = (currentIndex + 1) + " / " + totalSlides;
    }

    function toggleZoom(img) {
      if(img.classList.contains("zoomed")) {
        img.classList.remove("zoomed");
        img.style.transformOrigin = "center center";
      } else {
        resetZoom();
        img.classList.add("zoomed");
      }
    }

    function zoomMove(e, img) {
      if(!img.classList.contains("zoomed")) return;
      var rect = img.getBoundingClientRect();
      var x = ((e.clientX - rect.left) / rect.width) * 100;
      var y = ((e.clientY - rect.top) / rect.height) * 100;
      img.style.transformOrigin = x + "% " + y + "%";
    }

    function resetZoom() {
      document.querySelectorAll(".img-container img").forEach(img => {
        img.classList.remove("zoomed");
        img.style.transformOrigin = "center center";
      });
    }

    inner.addEventListener("scroll", function() {
      clearTimeout(window.scrollTM);
      window.scrollTM = setTimeout(function() {
        var index = Math.round(inner.scrollLeft / inner.clientWidth);
        if(index !== currentIndex && index >= 0 && index < totalSlides) {
          currentIndex = index;
          updateUI();
        }
      }, 80);
    });
  </script>
</body>
</html>
