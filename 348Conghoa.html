<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735739/z6094117763878_e4aeb60c97885d46825d22e56b037cb5_g0vi9q.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735746/348_C%E1%BB%99ng_H%C3%B2a_u9bvj8.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735741/z6094961813004_b1422d3dbe67f16c4bfd6b37213e42f3_q222pk.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735737/z6094962404067_2dbb2964e9ea281514f5e480a16861d6_blburf.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/video/upload/v1780735715/6814537828090_ags5b4.mp4" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735692/z6814530741071_0c131a4fbf8aa11a96422e7b40b9e245_qdgu75.jpg" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735721/SH_j6zfmr.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780735745/z5805577097290_53f27b1d08afd896598edfd430721a0d_rhbzy7.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 8</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 8;
    });
  </script>
</body>
</html>
