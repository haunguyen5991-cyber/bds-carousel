<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    .carousel-container { width: 100%; height: 100vh; max-height: 450px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
    .indicator { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 15, 15, 0.7); color: #ffffff; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374876/z6830279030812_510c1c7bf908a1bf9f58907a5fbcf880_laxw0x.jpg" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374827/z6814522272548_fd0fe07cca7266ac8bde9f1c5ec82064_tyiplb.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374814/z6814522058160_628b9ee6ab064a15019d751fdec69cfc_tsvv4g.jpg" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374796/z6781069354209_66e4c9102919ad4f29cd5f7731cc312c_nzmycv.jpg" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374762/%E1%BA%A2nh_nh%C3%A0_lrrtee.jpg" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/video/upload/v1781374612/6814522300134_kizora.mp4" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374770/z6781069293092_be1b5b50804b1cc278df8bb57bfce803_e3pdpp.jpg" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374767/z6781069280375_e8ae6e9bdf008832097da3de9113af84_cae0gb.jpg" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374785/z6781069315289_fcdbfdd4e65080d5cb54201d2fd5bf80_ywnwv9.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374781/z6781069308750_b70f49824e9470771c144f91b2b94760_yb2oe2.jpg" alt="BDS Image 10" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781374774/z6781069297969_2030877987fc12a8a3c507f97a8c2a6f_lv9dwe.jpg" alt="BDS Image 11" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 11</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 11;
    });
  </script>
</body>
</html>
