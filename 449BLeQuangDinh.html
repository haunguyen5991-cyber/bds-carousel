<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#ffffff; }.carousel-container { width:100%; height:100vh; position:relative; display:flex; align-items:center; justify-content:center; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { width:100%; height:100%; object-fit:cover; border-radius:4px; pointer-events:none; }.indicator { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 10px; font-size:12px; font-weight:bold; border-radius:12px; font-family:sans-serif; pointer-events:none; }</style></head><body><div class="carousel-container"><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781801177/08400214-bad2-4e99-9538-314090eebb62.png" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781801238/e0871430-ed29-4d15-9168-7cfb4c40bb76.png" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781800984/SH_1_kfw3jr.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781800984/SH_2_lrcxzn.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781801669/7364309c-6a37-49c3-9b98-92c9a116b780.png" alt="BDS 5" loading="lazy"></div></div><div class="indicator" id="counter">1 / 5</div></div><script>const slider = document.getElementById("slider");slider.addEventListener("scroll", () => {  const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;  document.getElementById("counter").innerText = pageIndex + " / " + 5;});</script></body></html>
