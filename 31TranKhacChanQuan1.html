<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 100%); font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:620px; box-sizing:border-box; overflow:hidden; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100%; background: transparent; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { max-width:96%; max-height:94%; object-fit:contain; filter: drop-shadow(0px 8px 24px rgba(0,0,0,0.65)); border-radius:12px; transition: transform 0.3s ease; }.thumbnail-sidebar { width:110px; background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(10px); display:flex; flex-direction:column; gap:10px; padding:15px 10px; overflow-y:auto; border-left: 1px solid rgba(255,255,255,0.06); box-sizing:border-box; height:100%; }.thumbnail-sidebar::-webkit-scrollbar { width:4px; }.thumbnail-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius:4px; }.thumb-item { width:100%; aspect-ratio:4/3; border-radius:6px; overflow:hidden; cursor:pointer; opacity:0.4; border: 2px solid transparent; transition: all 0.25s ease; flex-shrink:0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item:hover { opacity:0.8; transform: scale(1.03); }.thumb-item.active { opacity:1; border-color: #D4AF37; box-shadow: 0 0 12px rgba(212,175,55,0.4); }</style></head><body><div class="main-layout"><div class="carousel-container"><div class="carousel-inner" id="carouselInner"><div class="carousel-slide"><img src="31 Trần Khắc Chân" alt="BDS 1" loading="lazy"></div></div></div><div class="thumbnail-sidebar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="31 Trần Khắc Chân"></div></div></div><script>var inner = document.getElementById("carouselInner");var items = document.querySelectorAll(".thumb-item");function goToSlide(index){  var width = inner.clientWidth;  inner.scrollTo({ left: width * index, behavior: "smooth" });  items.forEach(function(item, idx){    if(idx === index) item.classList.add("active"); else item.classList.remove("active");  });}inner.addEventListener("scroll", function(){  clearTimeout(window.scrollTM);  window.scrollTM = setTimeout(function(){    var index = Math.round(inner.scrollLeft / inner.clientWidth);    items.forEach(function(item, idx){      if(idx === index) item.classList.add("active"); else item.classList.remove("active");    });  }, 100);});</script></body></html>
