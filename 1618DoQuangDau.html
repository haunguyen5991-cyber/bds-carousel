<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f1ef; }
    /* Tăng chiều cao khung chứa tối đa lên 600px để slide hiển thị to rõ hơn */
    .carousel-container { width: 100%; height: 100vh; max-height: 600px; position: relative; display: flex; align-items: center; justify-content: center; }
    .carousel-inner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .carousel-inner::-webkit-scrollbar { display: none; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
    /* Thiết lập ảnh tự động co giãn thông minh tràn khung ảnh lớn */
    .carousel-slide img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; pointer-events: none; }
    .indicator { position: absolute; bottom: 16px; right: 16px; background: rgba(15, 15, 15, 0.75); color: #ffffff; padding: 5px 12px; font-size: 13px; font-weight: 500; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel-inner" id="slider">
      
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849706/IMG_9789_qdpoms.heic" alt="BDS Image 1" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/1_en2owc.jpg" alt="BDS Image 2" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/IMG_9800_mj0ff6.heic" alt="BDS Image 3" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/IMG_9799_okugld.heic" alt="BDS Image 4" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849287/IMG_9798_fzkig9.heic" alt="BDS Image 5" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849291/IMG_9790_pnovkm.heic" alt="BDS Image 6" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849739/IMG_9785_ptvqd0.heic" alt="BDS Image 7" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849739/IMG_9785_ptvqd0.heic" alt="BDS Image 8" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849848/z6886390078387_529b974123c3e42a8da1e20c5a5cca70_vzwb5x.jpg" alt="BDS Image 9" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849847/z6886390063826_638c4b267c3a6ba3d9752f8df246c6b4_y6rwxd.jpg" alt="BDS Image 10" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849837/z6886390080603_3373b29e1ed9cda98d46f08ffcc3ca17_opdg63.jpg" alt="BDS Image 11" loading="lazy">
    </div>
    <div class="carousel-slide">
      <img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849836/z6886390063690_7757081a6fcca296c95d3aeb86d95082_wjodc2.jpg" alt="BDS Image 12" loading="lazy">
    </div>
    </div>
    <div class="indicator" id="counter">1 / 12</div>
  </div>
  <script>
    const slider = document.getElementById("slider");
    const counter = document.getElementById("counter");
    slider.addEventListener("scroll", () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      counter.innerText = pageIndex + " / " + 12;
    });
  </script>
</body>
</html>
