<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background-color:#111111; font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; background:#111111; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; height:100%; background:#1a1a1a; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; background:#111111; }.carousel-slide img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.4); color:#ffffff; border:none; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.2s ease; backdrop-filter:blur(4px); }.nav-btn:hover { background:rgba(0,0,0,0.7); transform:translateY(-50%) scale(1.05); }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; left:15px; background:rgba(0,0,0,0.6); color:#fff; padding:5px 12px; font-size:12px; font-weight:500; border-radius:20px; z-index:10; backdrop-filter:blur(4px); }.thumbs-vertical-container { width:95px; height:100%; background:#161616; box-sizing:border-box; padding:15px 8px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-left:1px solid #222222; -webkit-overflow-scrolling:touch; }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#333333; border-radius:4px; }.thumb-item { width:76px; height:58px; flex-shrink:0; border-radius:6px; overflow:hidden; cursor:pointer; opacity:0.35; border:2px solid transparent; transition:all 0.2s ease; margin:0 auto; box-sizing:border-box; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#007aff; transform:scale(1.02); box-shadow:0 0 8px rgba(0,122,255,0.4); }/* Đáp ứng tương thích linh hoạt cho các thiết bị di động nhỏ */@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:70px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid #222222; padding:8px; gap:8px; }  .thumb-item { width:65px; height:48px; }}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849706/IMG_9789_qdpoms.heic" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/1_en2owc.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/IMG_9800_mj0ff6.heic" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849286/IMG_9799_okugld.heic" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849287/IMG_9798_fzkig9.heic" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849291/IMG_9790_pnovkm.heic" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><i onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849291/IMG_9790_pnovkm.heic"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849739/IMG_9785_ptvqd0.heic"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849739/IMG_9785_ptvqd0.heic"></div><div class="thumb-item" onclick="goToSlide(8)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849848/z6886390078387_529b974123c3e42a8da1e20c5a5cca70_vzwb5x.jpg"></div><div class="thumb-item" onclick="goToSlide(9)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849847/z6886390063826_638c4b267c3a6ba3d9752f8df246c6b4_y6rwxd.jpg"></div><div class="thumb-item" onclick="goToSlide(10)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849837/z6886390080603_3373b29e1ed9cda98d46f08ffcc3ca17_opdg63.jpg"></div><div class="thumb-item" onclick="goToSlide(11)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780849836/z6886390063690_7757081a6fcca296c95d3aeb86d95082_wjodc2.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 12;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) {      updateActiveStatus(index);    }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
