<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#ffffff; }.carousel-container { width:100%; height:100vh; position:relative; display:flex; align-items:center; justify-content:center; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { width:100%; height:100%; object-fit:cover; border-radius:4px; pointer-events:none; }.indicator { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 10px; font-size:12px; font-weight:bold; border-radius:12px; font-family:sans-serif; pointer-events:none; }</style></head><body><div class="carousel-container"><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118666965363_a7afed8649c739e12d5b25e05deaf2e4_nyf3nd.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815223/z6118667518088_2090e3918929b2841d7425608e57946d_lgfwfy.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815215/z6781059545143_a926f03862a8fce8f595f7846afb1709_uf22ti.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118667551862_4bd8c2333a38b50a63085c5618bf163d_lpldx8.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815176/z6781059560106_7b03aaf82fd53472090e386264931407_brrp4b.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815222/z6781059550624_28cd8a77ef28ff1eafb5ab076bb6f8e1_thjqzg.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815245/z6118667526847_a758b50c6404f1fc5c5ed4d09ed685fa_vzvlgf.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815246/z6118667567900_4b4dea0710b79b894f464179e198e196_tz3z1x.jpg" alt="BDS 8" loading="lazy"></div></div><div class="indicator" id="counter">1 / 8</div></div><script>const slider = document.getElementById("slider");slider.addEventListener("scroll", () => {  const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;  document.getElementById("counter").innerText = pageIndex + " / " + 8;});</script></body></html>
