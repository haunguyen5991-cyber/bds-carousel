<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background-color:#111111; font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; background:#111111; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; height:100%; background:#1a1a1a; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; background:#111111; }.carousel-slide img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.4); color:#ffffff; border:none; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.2s ease; backdrop-filter:blur(4px); }.nav-btn:hover { background:rgba(0,0,0,0.7); transform:translateY(-50%) scale(1.05); }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; left:15px; background:rgba(0,0,0,0.6); color:#fff; padding:5px 12px; font-size:12px; font-weight:500; border-radius:20px; z-index:10; backdrop-filter:blur(4px); }.thumbs-vertical-container { width:95px; height:100%; background:#161616; box-sizing:border-box; padding:15px 8px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-left:1px solid #222222; -webkit-overflow-scrolling:touch; }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#333333; border-radius:4px; }.thumb-item { width:76px; height:58px; flex-shrink:0; border-radius:6px; overflow:hidden; cursor:pointer; opacity:0.35; border:2px solid transparent; transition:all 0.2s ease; margin:0 auto; box-sizing:border-box; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#007aff; transform:scale(1.02); box-shadow:0 0 8px rgba(0,122,255,0.4); }/* Đáp ứng tương thích linh hoạt cho các thiết bị di động nhỏ */@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:70px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid #222222; padding:8px; gap:8px; }  .thumb-item { width:65px; height:48px; }}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118666965363_a7afed8649c739e12d5b25e05deaf2e4_nyf3nd.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815223/z6118667518088_2090e3918929b2841d7425608e57946d_lgfwfy.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815215/z6781059545143_a926f03862a8fce8f595f7846afb1709_uf22ti.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118667551862_4bd8c2333a38b50a63085c5618bf163d_lpldx8.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815176/z6781059560106_7b03aaf82fd53472090e386264931407_brrp4b.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815222/z6781059550624_28cd8a77ef28ff1eafb5ab076bb6f8e1_thjqzg.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815245/z6118667526847_a758b50c6404f1fc5c5ed4d09ed685fa_vzvlgf.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815246/z6118667567900_4b4dea0710b79b894f464179e198e196_tz3z1x.jpg" alt="BDS 8" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 8</div></div><div class="thumbs-vertical-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118666965363_a7afed8649c739e12d5b25e05deaf2e4_nyf3nd.jpg"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815223/z6118667518088_2090e3918929b2841d7425608e57946d_lgfwfy.jpg"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815215/z6781059545143_a926f03862a8fce8f595f7846afb1709_uf22ti.jpg"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815224/z6118667551862_4bd8c2333a38b50a63085c5618bf163d_lpldx8.jpg"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815176/z6781059560106_7b03aaf82fd53472090e386264931407_brrp4b.jpg"></div><div class="thumb-item" onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815222/z6781059550624_28cd8a77ef28ff1eafb5ab076bb6f8e1_thjqzg.jpg"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815245/z6118667526847_a758b50c6404f1fc5c5ed4d09ed685fa_vzvlgf.jpg"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780815246/z6118667567900_4b4dea0710b79b894f464179e198e196_tz3z1x.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 8;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) {      updateActiveStatus(index);    }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
