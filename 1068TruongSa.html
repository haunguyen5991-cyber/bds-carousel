<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#ffffff; }.carousel-container { width:100%; height:100vh; position:relative; display:flex; align-items:center; justify-content:center; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { width:100%; height:100%; object-fit:cover; border-radius:4px; pointer-events:none; }.indicator { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 10px; font-size:12px; font-weight:bold; border-radius:12px; font-family:sans-serif; pointer-events:none; }</style></head><body><div class="carousel-container"><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781535954/z7343653995630_09fffcd7e3c4e7465503141e050656aa_kk08cb.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781535836/%E1%BA%A2nh_nh%C3%A0_x0qchp.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781535836/%E1%BA%A2nh_nh%C3%A0_3_g8thqh.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781535955/z7343654019214_39f5e0f4b3e25b51a832a9430a0090ca_ymkxfj.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781536266/z7343654019217_c5ef548f6e91ade959a5d373ba0d9921_wetue6.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781535967/z7343654019215_f4e9837334279adbf8d70e978e8a54b0_c5789a.jpg" alt="BDS 6" loading="lazy"></div></div><div class="indicator" id="counter">1 / 6</div></div><script>const slider = document.getElementById("slider");slider.addEventListener("scroll", () => {  const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth) + 1;  document.getElementById("counter").innerText = pageIndex + " / " + 6;});</script></body></html>
