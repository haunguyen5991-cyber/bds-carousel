<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; height:100%; background: transparent; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; drop-shadow(0px 10px 30px rgba(0,0,0,0.9)); }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.5); color:#ffffff; border:1px solid rgba(255,255,255,0.1); width:46px; height:46px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.3s ease; backdrop-filter:blur(8px); }.nav-btn:hover { background:rgba(212,175,55,0.2); color:#d4af37; border-color:#d4af37; transform:translateY(-50%) scale(1.08); }.nav-left { left:20px; }.nav-right { right:20px; }.indicator { position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.7); color:#d4af37; border:1px solid rgba(212,175,55,0.3); padding:6px 14px; font-size:12px; font-weight:600; border-radius:4px; letter-spacing:1px; z-index:10; backdrop-filter:blur(6px); }.thumbs-vertical-container { width:105px; height:100%; background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%); box-sizing:border-box; padding:20px 10px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; border-left:1px solid rgba(212,175,55,0.15); -webkit-overflow-scrolling:touch; }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#d4af37; border-radius:4px; }.thumb-item { width:82px; height:62px; flex-shrink:0; border-radius:4px; overflow:hidden; cursor:pointer; opacity:0.35; border:1.5px solid transparent; transition:all 0.25s ease; margin:0 auto; box-sizing:border-box; position:relative; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#d4af37; transform:scale(1.03); box-shadow:0 0 12px rgba(212,175,55,0.4); }@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:75px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid rgba(212,175,55,0.15); padding:10px; gap:10px; }  .thumb-item { width:70px; height:52px; }}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739646/z6304876253025_32699e34b751e0e400aeb53f7d766a89_qgwuu0.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739635/z6304876261378_2bc344d041a7a711535738046c6144df_jeo6y1.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739620/343895409_soa7mj.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739592/z6304876261577_1ba4c7141081f280063d93175b1947e2_kkcjnk.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739585/448340165_qruhaq.jpg" alt="BDS 5" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739593/343895425_wnp0qm.jpg" alt="BDS 6" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739615/343895433_tk8p84.jpg" alt="BDS 7" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739616/448340209_ppa6tq.jpg" alt="BDS 8" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739628/448340220_cct2hh.jpg" alt="BDS 9" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739640/048e39023aa17b3d0d592fa914036899_m6sjyz.jpg" alt="BDS 10" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739661/z6304876274869_fac995227176cf2cde1f29d0e08e9536_cbowqp.jpg" alt="BDS 11" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739671/SH_1_txagnw.jpg" alt="BDS 12" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739660/SH_2_ypjp6a.jpg" alt="BDS 13" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 13</div></div><div class="thumbs-vertical-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739646/z6304876253025_32699e34b751e0e400aeb53f7d766a89_qgwuu0.jpg"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739635/z6304876261378_2bc344d041a7a711535738046c6144df_jeo6y1.jpg"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739620/343895409_soa7mj.jpg"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739592/z6304876261577_1ba4c7141081f280063d93175b1947e2_kkcjnk.jpg"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739585/448340165_qruhaq.jpg"></div><div class="thumb-item" onclick="goToSlide(5)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739593/343895425_wnp0qm.jpg"></div><div class="thumb-item" onclick="goToSlide(6)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739615/343895433_tk8p84.jpg"></div><div class="thumb-item" onclick="goToSlide(7)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739616/448340209_ppa6tq.jpg"></div><div class="thumb-item" onclick="goToSlide(8)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739628/448340220_cct2hh.jpg"></div><div class="thumb-item" onclick="goToSlide(9)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739640/048e39023aa17b3d0d592fa914036899_m6sjyz.jpg"></div><div class="thumb-item" onclick="goToSlide(10)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739661/z6304876274869_fac995227176cf2cde1f29d0e08e9536_cbowqp.jpg"></div><div class="thumb-item" onclick="goToSlide(11)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739671/SH_1_txagnw.jpg"></div><div class="thumb-item" onclick="goToSlide(12)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1780739660/SH_2_ypjp6a.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 13;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) {      updateActiveStatus(index);    }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
