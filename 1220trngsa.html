<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #f8f8f8; }
    
    .gallery {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f8f8f8;
    }
    
    .main-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      width: 100%;
    }
    
    .counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 10;
    }
    
    #mainMediaWrap {
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    
    #mainMediaWrap img, #mainMediaWrap video {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      width: auto;
      height: auto;
      display: block;
    }
    
    .brand-label {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 10px;
      color: rgba(0,0,0,0.12);
      font-weight: 500;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
    
    .thumb-rail {
      height: 110px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      gap: 10px;
      padding: 5px;
    }
    
    .thumb {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      background: #f0f0f0;
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .thumb.active {
      border-color: #1f2937;
    }
    
    .thumb:hover {
      border-color: #999;
    }
  
.fullscreen-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);backdrop-filter:blur(6px);padding:24px;box-sizing:border-box}.fullscreen-overlay.open{display:flex}.fullscreen-overlay img{max-width:calc(100vw - 96px);max-height:calc(100vh - 72px);width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.65)}.fullscreen-close,.fullscreen-prev,.fullscreen-next{position:absolute;border:0;color:#fff;background:rgba(30,30,30,.72);cursor:pointer;width:44px;height:44px;border-radius:50%;font-size:30px;line-height:40px;text-align:center;z-index:2}.fullscreen-close{top:18px;right:18px;font-size:28px}.fullscreen-prev{left:18px;top:50%;transform:translateY(-50%)}.fullscreen-next{right:18px;top:50%;transform:translateY(-50%)}.fullscreen-close:hover,.fullscreen-prev:hover,.fullscreen-next:hover{background:rgba(212,175,55,.9);color:#111}.carousel-slide img{cursor:zoom-in}@media(max-width:600px){.fullscreen-overlay{padding:12px}.fullscreen-overlay img{max-width:calc(100vw - 56px);max-height:calc(100vh - 56px)}.fullscreen-close{top:10px;right:10px}.fullscreen-prev{left:6px}.fullscreen-next{right:6px}}
</style>
</head>
<body>
  <div class="gallery">
    <div class="main-view" id="mainView">
      <div class="counter" id="counter">1 / 10</div>
      <div id="mainMediaWrap" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
      <div class="brand-label">dulieunhapho.com</div>
    </div>
    <div class="thumb-rail" id="thumbRail"></div>
  </div>

  <script>
    const items = [
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/23230a20a0fc-IMG_2456_rwtvwh.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/23230a20a0fc-IMG_2456_rwtvwh.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c8bbab72171a-1_phju8v.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/c8bbab72171a-1_phju8v.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/bf77bc55925d-2_bmpuyz.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/bf77bc55925d-2_bmpuyz.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/8757aa4bef9f-IMG_2470_ke3pgm.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/8757aa4bef9f-IMG_2470_ke3pgm.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/bd996c18d8b2-IMG_2440_sf5ypc.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/bd996c18d8b2-IMG_2440_sf5ypc.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/658e4052210e-IMG_2442_koymvj.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/658e4052210e-IMG_2442_koymvj.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/191a32d9afda-IMG_2445_rbyilp.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/191a32d9afda-IMG_2445_rbyilp.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/901fda414968-SH_1_pvrwc1.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/901fda414968-SH_1_pvrwc1.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/60f6725eda34-SH_2_rdbpfs.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/60f6725eda34-SH_2_rdbpfs.jpg', type: 'image' },
      { url: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fa1b1003f1fb-z7153839143235_6355728faecf7e84fe522c62dd5e1116_xqzirw.jpg', thumb: 'https://pub-21171ec87ede4630929bc563a071399f.r2.dev/images/fa1b1003f1fb-z7153839143235_6355728faecf7e84fe522c62dd5e1116_xqzirw.jpg', type: 'image' }
    ];
    
    let currentIndex = 0;
    
    function updateMain() {
      const item = items[currentIndex];
      const wrap = document.getElementById('mainMediaWrap');
      wrap.innerHTML = '';
      
      if (item.type === 'video') {
        wrap.innerHTML = '<video src="' + item.url + '" muted preload="metadata" controls></video>';
      } else {
        wrap.innerHTML = '<img src="' + item.url + '" loading="lazy">';
      }
      
      document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + items.length;
      updateThumbs();
    }
    
    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
      });
    }
    
    function initThumbs() {
      const rail = document.getElementById('thumbRail');
      items.forEach((item, idx) => {
        const t = document.createElement('div');
        t.className = 'thumb' + (idx === 0 ? ' active' : '');
        t.innerHTML = '<img src="' + item.thumb + '" loading="lazy">';
        t.onclick = () => { currentIndex = idx; updateMain(); };
        rail.appendChild(t);
      });
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') currentIndex = (currentIndex - 1 + items.length) % items.length;
      if (e.key === 'ArrowRight') currentIndex = (currentIndex + 1) % items.length;
      updateMain();
    });
    
    initThumbs();
    updateMain();
  </script>
<div class="fullscreen-overlay" id="fullscreenOverlay" role="dialog" aria-modal="true" aria-label="Xem ảnh toàn màn hình"><button class="fullscreen-close" id="fullscreenClose" aria-label="Đóng">×</button><button class="fullscreen-prev" id="fullscreenPrev" aria-label="Ảnh trước">‹</button><img id="fullscreenImage" alt="Ảnh bất động sản toàn màn hình"><button class="fullscreen-next" id="fullscreenNext" aria-label="Ảnh tiếp theo">›</button></div><script>
(function(){var overlay=document.getElementById("fullscreenOverlay"),fullImg=document.getElementById("fullscreenImage"),closeBtn=document.getElementById("fullscreenClose"),prevBtn=document.getElementById("fullscreenPrev"),nextBtn=document.getElementById("fullscreenNext"),slides=Array.prototype.slice.call(document.querySelectorAll(".carousel-slide img")),current=0;function show(i){if(!slides.length)return;current=(i+slides.length)%slides.length;fullImg.src=slides[current].src;fullImg.alt=slides[current].alt||"Ảnh bất động sản";overlay.classList.add("open");document.body.style.overflow="hidden";}function close(){overlay.classList.remove("open");document.body.style.overflow="hidden";fullImg.removeAttribute("src");}slides.forEach(function(img,i){img.addEventListener("click",function(e){e.stopPropagation();show(i);});});closeBtn.addEventListener("click",function(e){e.stopPropagation();close();});prevBtn.addEventListener("click",function(e){e.stopPropagation();show(current-1);});nextBtn.addEventListener("click",function(e){e.stopPropagation();show(current+1);});overlay.addEventListener("click",function(e){if(e.target===overlay)close();});document.addEventListener("keydown",function(e){if(!overlay.classList.contains("open"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(current-1);else if(e.key==="ArrowRight")show(current+1);});})();
</script></body>
</html>
