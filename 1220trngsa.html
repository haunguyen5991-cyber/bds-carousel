<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #f8f8f8; }
    
    .gallery {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f8f8f8;
    }
    
    .main-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
      position: relative;
      overflow: hidden;
    }
    
    .counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 10;
    }
    
    #mainMediaWrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #mainMediaWrap img, #mainMediaWrap video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    .brand-label {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 10px;
      color: rgba(0,0,0,0.12);
      font-weight: 500;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
    
    .thumb-rail {
      height: 110px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      gap: 10px;
      padding: 5px;
    }
    
    .thumb {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      background: #f0f0f0;
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .thumb.active {
      border-color: #1f2937;
    }
    
    .thumb:hover {
      border-color: #999;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="main-view" id="mainView">
      <div class="counter" id="counter">1 / 11</div>
      <div id="mainMediaWrap" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
      <div class="brand-label">dulieunhapho.com</div>
    </div>
    <div class="thumb-rail" id="thumbRail"></div>
  </div>

  <script>
    const items = [
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/IMG_2437_tz9ame.heic', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/IMG_2437_tz9ame.heic', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/1_phju8v.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/1_phju8v.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/2_bmpuyz.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727874/2_bmpuyz.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271527/IMG_2470_ke3pgm.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271527/IMG_2470_ke3pgm.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271524/IMG_2456_rwtvwh.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271524/IMG_2456_rwtvwh.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2440_sf5ypc.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2440_sf5ypc.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2442_koymvj.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2442_koymvj.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2445_rbyilp.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1783271520/IMG_2445_rbyilp.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727880/SH_1_pvrwc1.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727880/SH_1_pvrwc1.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727878/SH_2_rdbpfs.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727878/SH_2_rdbpfs.jpg', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727880/z7153839143235_6355728faecf7e84fe522c62dd5e1116_xqzirw.jpg', thumb: 'https://res.cloudinary.com/dcspxywol/image/upload/c_fill,g_auto,w_300,h_300,q_auto:best,f_auto,dpr_auto/c_fill,g_auto,w_1920,h_800,q_auto:best,f_auto,dpr_auto/v1780727880/z7153839143235_6355728faecf7e84fe522c62dd5e1116_xqzirw.jpg', type: 'image' }
    ];
    
    let currentIndex = 0;
    
    function updateMain() {
      const item = items[currentIndex];
      const wrap = document.getElementById('mainMediaWrap');
      wrap.innerHTML = '';
      
      if (item.type === 'video') {
        wrap.innerHTML = '<video src="' + item.url + '" muted preload="metadata" controls></video>';
      } else {
        wrap.innerHTML = '<img src="' + item.url + '" loading="lazy">';
      }
      
      document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + items.length;
      updateThumbs();
    }
    
    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
      });
    }
    
    function initThumbs() {
      const rail = document.getElementById('thumbRail');
      items.forEach((item, idx) => {
        const t = document.createElement('div');
        t.className = 'thumb' + (idx === 0 ? ' active' : '');
        t.innerHTML = '<img src="' + item.thumb + '" loading="lazy">';
        t.onclick = () => { currentIndex = idx; updateMain(); };
        rail.appendChild(t);
      });
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') currentIndex = (currentIndex - 1 + items.length) % items.length;
      if (e.key === 'ArrowRight') currentIndex = (currentIndex + 1) % items.length;
      updateMain();
    });
    
    initThumbs();
    updateMain();
  </script>
</body>
</html>
