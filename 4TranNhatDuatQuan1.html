<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 100%); font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:620px; box-sizing:border-box; overflow:hidden; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100%; background: transparent; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; overflow:hidden; }.img-zoom-container { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }.img-zoom-container img { max-width:96%; max-height:94%; object-fit:contain; filter: drop-shadow(0px 8px 24px rgba(0,0,0,0.65)); border-radius:12px; transition: transform 0.2s ease-out; cursor: zoom-in; transform-origin: center center; }.img-zoom-container img.zoomed { transform: scale(2); cursor: zoom-out; border-radius:4px; }.thumbnail-sidebar { width:125px; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(15px); display:flex; flex-direction:column; gap:12px; padding:15px 10px; overflow-y:auto; border-left: 1px solid rgba(255,255,255,0.08); box-sizing:border-box; height:100%; }.thumbnail-sidebar::-webkit-scrollbar { width:4px; }.thumbnail-sidebar::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius:4px; }.thumb-item { width:100%; aspect-ratio:4/3; border-radius:8px; overflow:hidden; cursor:pointer; opacity:0.4; border: 2px solid transparent; transition: all 0.25s ease; flex-shrink:0; position:relative; box-shadow: 0 4px 10px rgba(0,0,0,0.4); background:#151515; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item:hover { opacity:0.8; transform: scale(1.02); }.thumb-item.active { opacity:1; border-color: #D4AF37; box-shadow: 0 0 14px rgba(212,175,55,0.5); }.video-badge { position:absolute; top:4px; left:4px; background:#D4AF37; color:#000; font-size:9px; font-weight:bold; padding:2px 5px; border-radius:4px; z-index:5; }.play-icon-center { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#D4AF37; font-size:22px; z-index:4; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.8)); pointer-events:none; }.video-placeholder-bg { width:100%; height:100%; background: linear-gradient(135deg, #2c2c2c 0%, #151515 100%); }
.fullscreen-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);backdrop-filter:blur(6px);padding:24px;box-sizing:border-box}.fullscreen-overlay.open{display:flex}.fullscreen-overlay img{max-width:calc(100vw - 96px);max-height:calc(100vh - 72px);width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.65)}.fullscreen-close,.fullscreen-prev,.fullscreen-next{position:absolute;border:0;color:#fff;background:rgba(30,30,30,.72);cursor:pointer;width:44px;height:44px;border-radius:50%;font-size:30px;line-height:40px;text-align:center;z-index:2}.fullscreen-close{top:18px;right:18px;font-size:28px}.fullscreen-prev{left:18px;top:50%;transform:translateY(-50%)}.fullscreen-next{right:18px;top:50%;transform:translateY(-50%)}.fullscreen-close:hover,.fullscreen-prev:hover,.fullscreen-next:hover{background:rgba(212,175,55,.9);color:#111}.carousel-slide img{cursor:zoom-in}@media(max-width:600px){.fullscreen-overlay{padding:12px}.fullscreen-overlay img{max-width:calc(100vw - 56px);max-height:calc(100vh - 56px)}.fullscreen-close{top:10px;right:10px}.fullscreen-prev{left:6px}.fullscreen-next{right:6px}}
</style></head><body><div class="main-layout"><div class="carousel-container"><div class="carousel-inner" id="carouselInner"><div class="carousel-slide">  <div class="img-zoom-container">    <img src="4 Trần Nhật Duật" alt="BDS 1" loading="lazy" ondblclick="toggleZoom(this)" onmousemove="zoomMove(event, this)">  </div></div></div></div><div class="thumbnail-sidebar"><div class="thumb-item active" onclick="goToSlide(0)">  <img src="4 Trần Nhật Duật" onerror="this.src='https://placehold.co/120x90/2c2c2c/ffffff?text=No+Image'"></div></div></div><script>var inner = document.getElementById("carouselInner");var items = document.querySelectorAll(".thumb-item");function goToSlide(index){  resetAllZoom();  var width = inner.clientWidth;  inner.scrollTo({ left: width * index, behavior: "smooth" });  updateActiveThumb(index);}inner.addEventListener("scroll", function(){  clearTimeout(window.scrollTM);  window.scrollTM = setTimeout(function(){    var index = Math.round(inner.scrollLeft / inner.clientWidth);    updateActiveThumb(index);  }, 120);});function updateActiveThumb(index){  items.forEach(function(item, idx){    if(idx === index) item.classList.add("active"); else item.classList.remove("active");  });}function toggleZoom(img){  if(img.classList.contains("zoomed")){    img.classList.remove("zoomed");    img.style.transformOrigin = "center center";  } else {    resetAllZoom();    img.classList.add("zoomed");  }}function zoomMove(e, img){  if(!img.classList.contains("zoomed")) return;  var rect = img.getBoundingClientRect();  var x = ((e.clientX - rect.left) / rect.width) * 100;  var y = ((e.clientY - rect.top) / rect.height) * 100;  img.style.transformOrigin = x + "% " + y + "%";}function resetAllZoom(){  document.querySelectorAll(".img-zoom-container img").forEach(function(img){    img.classList.remove("zoomed");    img.style.transformOrigin = "center center";  });}</script><div class="fullscreen-overlay" id="fullscreenOverlay" role="dialog" aria-modal="true" aria-label="Xem ảnh toàn màn hình"><button class="fullscreen-close" id="fullscreenClose" aria-label="Đóng">×</button><button class="fullscreen-prev" id="fullscreenPrev" aria-label="Ảnh trước">‹</button><img id="fullscreenImage" alt="Ảnh bất động sản toàn màn hình"><button class="fullscreen-next" id="fullscreenNext" aria-label="Ảnh tiếp theo">›</button></div><script>
(function(){var overlay=document.getElementById("fullscreenOverlay"),fullImg=document.getElementById("fullscreenImage"),closeBtn=document.getElementById("fullscreenClose"),prevBtn=document.getElementById("fullscreenPrev"),nextBtn=document.getElementById("fullscreenNext"),slides=Array.prototype.slice.call(document.querySelectorAll(".carousel-slide img")),current=0;function show(i){if(!slides.length)return;current=(i+slides.length)%slides.length;fullImg.src=slides[current].src;fullImg.alt=slides[current].alt||"Ảnh bất động sản";overlay.classList.add("open");document.body.style.overflow="hidden";}function close(){overlay.classList.remove("open");document.body.style.overflow="hidden";fullImg.removeAttribute("src");}slides.forEach(function(img,i){img.addEventListener("click",function(e){e.stopPropagation();show(i);});});closeBtn.addEventListener("click",function(e){e.stopPropagation();close();});prevBtn.addEventListener("click",function(e){e.stopPropagation();show(current-1);});nextBtn.addEventListener("click",function(e){e.stopPropagation();show(current+1);});overlay.addEventListener("click",function(e){if(e.target===overlay)close();});document.addEventListener("keydown",function(e){if(!overlay.classList.contains("open"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(current-1);else if(e.key==="ArrowRight")show(current+1);});})();
</script></body></html>
