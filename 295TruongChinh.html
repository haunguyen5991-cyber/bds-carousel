<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body, html { margin:0; padding:0; width:100%; height:100%; background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 100%); font-family:-apple-system,BlinkMacSystemFont,sans-serif; user-select:none; overflow:hidden; }.main-layout { display:flex; flex-direction:row; width:100%; height:100vh; box-sizing:border-box; }.carousel-container { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; height:100%; background: transparent; }.carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; scroll-behavior:smooth; }.carousel-inner::-webkit-scrollbar { display:none; }.carousel-slide { min-width:100%; width:100%; height:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }.carousel-slide img { max-width:96%; max-height:96%; width:auto; height:auto; object-fit:contain; filter: drop-shadow(0px 8px 24px rgba(0,0,0,0.7)); border-radius:6px; }.nav-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.6); color:#ffffff; border:1px solid rgba(255,255,255,0.1); width:44px; height:44px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:all 0.25s ease; backdrop-filter:blur(8px); }.nav-btn:hover { background:rgba(212,175,55,0.25); color:#d4af37; border-color:#d4af37; transform:translateY(-50%) scale(1.05); }.nav-left { left:15px; }.nav-right { right:15px; }.indicator { position:absolute; top:15px; left:15px; background:rgba(15,15,15,0.8); color:#d4af37; border:1px solid rgba(212,175,55,0.3); padding:5px 12px; font-size:11px; font-weight:600; border-radius:4px; letter-spacing:0.5px; z-index:10; backdrop-filter:blur(6px); }.thumbs-vertical-container { width:110px; height:100%; background: #0f0f0f; box-sizing:border-box; padding:15px 10px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-left:1px solid rgba(212,175,55,0.15); }.thumbs-vertical-container::-webkit-scrollbar { width:3px; }.thumbs-vertical-container::-webkit-scrollbar-thumb { background:#d4af37; border-radius:2px; }.thumb-item { width:86px; height:65px; flex-shrink:0; border-radius:4px; overflow:hidden; cursor:pointer; opacity:0.35; border:1.5px solid transparent; transition:all 0.2s ease; margin:0 auto; box-sizing:border-box; }.thumb-item img { width:100%; height:100%; object-fit:cover; }.thumb-item.active { opacity:1; border-color:#d4af37; box-shadow:0 0 10px rgba(212,175,55,0.35); }@media(max-width: 600px) {  .main-layout { flex-direction:column; }  .thumbs-vertical-container { width:100%; height:75px; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-left:none; border-top:1px solid rgba(212,175,55,0.15); padding:8px; gap:8px; }  .thumb-item { width:75px; height:56px; }}</style></head><body><div class="main-layout"><div class="carousel-container"><button class="nav-btn nav-left" onclick="moveSlide(-1)">&#10094;</button><div class="carousel-inner" id="slider"><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028641/0_a7facl.jpg" alt="BDS 1" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028801/6_jpc0fv.jpg" alt="BDS 2" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028793/4_umh3j9.jpg" alt="BDS 3" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028642/1_r6sy97.jpg" alt="BDS 4" loading="lazy"></div><div class="carousel-slide"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028759/2_in1orr.jpg" alt="BDS 5" loading="lazy"></div></div><button class="nav-btn nav-right" onclick="moveSlide(1)">&#10095;</button><div class="indicator" id="counter">1 / 5</div></div><div class="thumbs-vertical-container" id="thumbBar"><div class="thumb-item active" onclick="goToSlide(0)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028641/0_a7facl.jpg"></div><div class="thumb-item" onclick="goToSlide(1)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028801/6_jpc0fv.jpg"></div><div class="thumb-item" onclick="goToSlide(2)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028793/4_umh3j9.jpg"></div><div class="thumb-item" onclick="goToSlide(3)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028642/1_r6sy97.jpg"></div><div class="thumb-item" onclick="goToSlide(4)"><img src="https://res.cloudinary.com/dcspxywol/image/upload/v1781028759/2_in1orr.jpg"></div></div></div><script>const slider = document.getElementById("slider");const totalSlides = 5;const thumbs = document.querySelectorAll(".thumb-item");const thumbBar = document.getElementById("thumbBar");let currentIndex = 0;let isScrolling;slider.addEventListener("scroll", () => {  clearTimeout(isScrolling);  isScrolling = setTimeout(() => {    const index = Math.round(slider.scrollLeft / slider.clientWidth);    if (index !== currentIndex && index >= 0 && index < totalSlides) { updateActiveStatus(index); }  }, 60);});function updateActiveStatus(index) {  currentIndex = index;  document.getElementById("counter").innerText = (currentIndex + 1) + " / " + totalSlides;  thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));  const activeThumb = thumbs[currentIndex];  if (activeThumb) {    if (window.innerWidth > 600) {      thumbBar.scrollTo({ top: activeThumb.offsetTop - thumbBar.clientHeight / 2 + activeThumb.clientHeight / 2, behavior: "smooth" });    } else {      thumbBar.scrollTo({ left: activeThumb.offsetLeft - thumbBar.clientWidth / 2 + activeThumb.clientWidth / 2, behavior: "smooth" });    }  }}function moveSlide(direction) {  let targetIndex = currentIndex + direction;  if (targetIndex < 0) targetIndex = totalSlides - 1;  if (targetIndex >= totalSlides) targetIndex = 0;  goToSlide(targetIndex);}function goToSlide(index) {  slider.scrollTo({ left: index * slider.clientWidth, behavior: "smooth" });  updateActiveStatus(index);}</script></body></html>
